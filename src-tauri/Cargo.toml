[package]
name = "rustnotes"
version = "0.16.0"
description = "RustNotes: a simple, local-first notes app. Vue frontend, Rust backend (Tauri v2)."
authors = ["Simone Di Ricco"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sdiricco/rustnotes"

[lib]
name = "rustnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools": abilita "Ispeziona elemento" col tasto destro anche nelle build
# release, non solo in dev. Utile finche' l'app non ha un pubblico esterno da
# proteggere da un'ispezione troppo facile del proprio frontend.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "process", "io-util"] }
sys-locale = "0.3"
tauri-plugin-updater = "2.13.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-wdio = { version = "1", optional = true }

[features]
# Il server WebDriver embedded non entra mai nelle build distribuite: viene
# compilato e registrato solo dal comando `pnpm build:e2e`.
e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

# Su Windows il plugin embedded 1.4 non e' ancora compatibile con il
# webview2-com usato da Tauri 2.12; li' gli E2E usano tauri-driver ufficiale.
[target.'cfg(not(target_os = "windows"))'.dependencies]
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

# Solo macOS: barra del titolo alta con NSToolbar vuota (titlebar.rs). Stesse
# versioni gia' usate da tao, quindi nessuna crate in piu' da compilare.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSString + NSUserDefaults: spellcheck.rs.
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", features = [
    "NSToolbar",
    "NSWindow",
    "NSButton",
    "NSControl",
    "NSView",
    "NSResponder",
] }

[dev-dependencies]
tempfile = "3"
