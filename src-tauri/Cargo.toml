[package]
name = "rustnotes"
version = "0.13.0"
description = "RustNotes: a simple, local-first notes app. Vue frontend, Rust backend (Tauri v2)."
authors = ["Simone Di Ricco"]
edition = "2021"
license = "MIT"
repository = "https://github.com/sdiricco/rustnotes"

[lib]
name = "rustnotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "devtools": abilita "Ispeziona elemento" col tasto destro anche nelle build
# release, non solo in dev. Utile finche' l'app non ha un pubblico esterno da
# proteggere da un'ispezione troppo facile del proprio frontend.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
sys-locale = "0.3"

# Solo macOS: barra del titolo alta con NSToolbar vuota (titlebar.rs). Stesse
# versioni gia' usate da tao, quindi nessuna crate in piu' da compilare.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# NSString + NSUserDefaults: spellcheck.rs.
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3", features = [
    "NSToolbar",
    "NSWindow",
    "NSButton",
    "NSControl",
    "NSView",
    "NSResponder",
] }

[dev-dependencies]
tempfile = "3"
