name: Release

# Ogni tag "vX.Y.Z" builda l'app su mac (binario universale arm64+Intel),
# Windows (x64 + arm64) e Linux (x64 + arm64), poi pubblica una release
# GitHub con gli artefatti. Job separati per piattaforma: build
# indipendenti, un fallimento su un OS non blocca gli altri (fail-fast: false).
#
# Linux arm64 gira nativamente su runner ubuntu-*-arm (niente cross-compile:
# le librerie di sistema di webkit2gtk/GTK sono un incubo da cross-compilare,
# un runner con l'hardware giusto evita il problema alla radice).
#
# Solo macOS e' testato manualmente. Windows (WebView2) e Linux sono verificati
# dalla compilazione automatica, senza una prova manuale.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dipendenze frontend
        run: pnpm install --frozen-lockfile

      # Chiave API di App Store Connect per la notarizzazione: tauri-action
      # la legge da APPLE_API_KEY_PATH, quindi il contenuto del .p8 (secret)
      # va scritto su disco prima della build.
      - name: Prepara chiave API App Store Connect
        run: |
          echo "${{ secrets.APPLE_API_KEY_CONTENT }}" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      # Firma con Developer ID e notarizzazione Apple. Il certificato arriva
      # come .p12 in base64 (APPLE_CERTIFICATE): tauri-action lo importa in un
      # keychain temporaneo del runner. Con la build notarizzata e stapled il
      # .dmg si apre senza avvisi di Gatekeeper, niente piu' xattr a mano.
      - name: Build e pubblica (macOS universale, firmata e notarizzata)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RustNotes ${{ github.ref_name }}'
          releaseBody: |
            macOS: app firmata con Developer ID e notarizzata da Apple.
            Windows: installer non firmato, SmartScreen puo' mostrare un avviso
            al primo avvio ("Ulteriori informazioni" > "Esegui comunque").

            macOS: testato manualmente. Windows e Linux: compilati
            automaticamente ma non ancora testati a mano su questo progetto.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target universal-apple-darwin

  release-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dipendenze frontend
        run: pnpm install --frozen-lockfile

      - name: Build e pubblica (Windows ${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RustNotes ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.target }}

  release-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      # Librerie di sistema richieste dal bundler Tauri su Linux (webview,
      # AppIndicator per la tray icon, rsvg per le icone, xdg-utils per
      # xdg-open — quest'ultimo assente di default sul runner arm64, la
      # build fallisce con "xdg-open binary not found" se manca).
      - name: Install dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install dipendenze frontend
        run: pnpm install --frozen-lockfile

      - name: Build e pubblica (Linux ${{ matrix.arch }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RustNotes ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
