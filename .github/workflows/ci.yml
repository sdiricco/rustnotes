name: CI

# Controlli veloci su ogni push e pull request: lint, typecheck, build e test
# del frontend; `cargo fmt`, Clippy e test del backend. Il bundle completo
# (installer per ogni OS) resta nel workflow di release, che parte solo sui
# tag: qui basta sapere che il codice compila e i test passano.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node 22: jsdom (vitest) usa API di undici assenti in Node 20
      # ("webidl.util.markAsUncloneable is not a function").
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm exec vue-tsc --noEmit
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm exec vite build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Le stesse librerie del job Linux della release: tauri (webkit2gtk,
      # gtk) non compila senza.
      - name: Install dipendenze di sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Format
        run: cargo fmt --check
        working-directory: src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Test
        run: cargo test
        working-directory: src-tauri
